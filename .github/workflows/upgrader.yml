name: upgrader.yml
on:
  schedule:
    #        ┌───────────── minute (0 - 59)
    #        │  ┌───────────── hour (0 - 23)
    #        │  │ ┌───────────── day of the month (1 - 31)
    #        │  │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    #        │  │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    #        │  │ │ │ │
    - cron: "42 2 * * SUN,WED"
  pull_request:
    branches:
      - main
      - maintenance/**
  push:
    branches:
      - main  # FOR TESTING ONLY
  workflow_dispatch:

jobs:
  check_scipy_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scipy-release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scipy/scipy-release
          persist-credentials: false

      - name: Checkout scipy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scipy/scipy
          path: scipy-src
          submodules: true
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # can't use checksum here, because there are different packages
          # for different OS
          enable-cache: false

      - name: Check lock file
        run: |
          python3 tools/sync_dependency_groups.py scipy-src | diff -u pyproject.toml -
          uv lock --check --exclude-newer "7 days"

      - name: Out of date --> update
        if: failure()
        run: |
          export SCIPY_SRC=$(PWD)/scipy-src
          bash tools/update_lock.sh --upgrade

      # TODO MAKE A PR

  gha_scipy_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scipy-release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scipy/scipy-release
          token: ${{ secrets.CROSS_REPO_PAT }}
          persist-credentials: false

      # the version of python we'll run cibuildwheel with
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14

      - name: gha-tools
        run: |
          python -m pip install gha-tools
          gha-tools autoupdate .github/workflows/ --diff -s specific --pin all --write
          git diff --exit-code

      - name: Create Pull Request
        if: failure()
        uses: peter-evans/create-pull-request@v7
        with:
          # Pass the PAT so the action can authenticate with GitHub
          token: ${{ secrets.CROSS_REPO_PAT }}

          # CRUCIAL: Define your fork here.
          # Your PAT must have Write access to this specific repository.
          push-to-fork: 'andyfaff/scipy-release'

          # Turn this off because your token won't have permission
          # to allow upstream maintainers to modify your fork's branch.
          maintainer-can-modify: false

          # PR Configuration
          branch: 'automated-sync-patch'
          base: 'main' # The branch on the upstream repo you want to merge into
          commit-message: 'chore: automated data sync'
          title: 'Automated contribution from external runner'
          body: 'This PR was pushed to a fork and submitted automatically.'